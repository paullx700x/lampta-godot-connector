[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lampta-godot-connector"
version = "0.1.0"
description = "Project-scoped MCP tools for Godot scenes, resources and GDScript"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]
license = "MIT"

[project.scripts]
lampta-godot-connector = "lampta_godot_connector.server:main"

[tool.setuptools.packages.find]
where = ["src"]
